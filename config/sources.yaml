    query: "SPI-Report"
    fmt: xlsx
    frequency: weekly
    coverage: rolling; one file per week
    parser: parse_pbs_spi
    tier: 1
    notes: Filename pattern `3.-SPI-Report-DD.MM.YYYY.xlsx`. Discover via WP REST media API.

  - id: pbs_spi_monthly_prices_annex
