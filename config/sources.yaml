  # ----------------------------------------------------------------- MONETARY
  - id: sbp_broad_money_m2
    name: Broad Money (M2) — components and affecting factors
    publisher: sbp
    theme: monetary
    page: https://www.sbp.org.pk/ecodata/index2.asp
    url: https://www.sbp.org.pk/assets/document/BroadMoney_M2_Arch.xls
    fmt: xls
    frequency: weekly
    coverage: 1969-06 onward
    parser: parse_sbp_m2
    tier: 1
    notes: >-
      Multi-sheet by FY block (M2_FY70-FY90 ... 'M2_(FY23 to onwards)'); the parser
      concatenates all sheets. From the FY13 sheet onward SBP indents component rows one
      column further right than the aggregate rows, so the headline 'Broad Money (M2)
      (A+B+C)' label sits left of its own components; row labels must be resolved by
      scanning leftward from the first data column or the M2 total is silently dropped
      after 2012 while its components stay current.

