  # ---------------------------------------------------------------------------
  # SDMX 2.1 feeds
  # ---------------------------------------------------------------------------
  # Static XML, no API key and no session, served straight off the publishers'
  # web roots. These are the only genuinely machine-readable feeds the Government
  # of Pakistan offers for fiscal operations, producer prices, labour and energy,
  # so they are tier 1 despite being the least publicised sources on any GoP site.
  # Periods are FISCAL: FY2026 Q1 is Jul-Sep 2025. See etl/parsers/pbs.py.

  - id: mof_general_govt_operations_sdmx
    name: General Government Operations (Ministry of Finance, SDMX)
    publisher: mof
    theme: fiscal
    page: https://www.finance.gov.pk/fiscal_operations.html
    url: http://sdmx.finance.gov.pk/GGO_Pakistan.xml
    fmt: xml
    frequency: quarterly
    coverage: 2017-Q1 onward
    parser: parse_sdmx_mof_ggo
    tier: 1
    notes: >
      The ONLY machine-readable fiscal series published by the Government of
      Pakistan. Consolidated federal plus provincial revenue, expenditure and
      the deficit. Served over plain HTTP only - sdmx.finance.gov.pk has no TLS
      endpoint - so the content is verified by magic bytes and SHA-256 rather
      than by transport security. Everything else fiscal (budget documents, FBR
      collection, PSDP releases) is PDF-only.

  - id: mof_central_govt_operations_sdmx
    name: Central Government Operations (Ministry of Finance, SDMX)
    publisher: mof
    theme: fiscal
    page: https://www.finance.gov.pk/fiscal_operations.html
    url: http://sdmx.finance.gov.pk/CGO_Pakistan.xml
    fmt: xml
    frequency: quarterly
    coverage: 2017-Q1 onward
    parser: parse_sdmx_mof_cgo
    tier: 1
    notes: >
      Federal government only. Do not add to the general government figures -
      general government already consolidates the federal and provincial
      accounts, so summing the two double-counts federal revenue and spending.

  - id: pbs_merchandise_trade_sdmx
    name: Merchandise trade, monthly (PBS, SDMX)
    publisher: pbs
    theme: external
    page: https://www.pbs.gov.pk/external-trade-statistics/
    url: https://www.pbs.gov.pk/wp-content/uploads/2020/07/MET.xml
    fmt: xml
    frequency: monthly
    coverage: 2008-01 onward
    parser: parse_sdmx_pbs_trade
    tier: 1
    notes: >
      CUSTOMS basis, in rupees. This is the longest machine-readable monthly
      trade history available - the PBS monthly summary spreadsheet only carries
      about a year. Never combine with the SBP balance-of-payments trade series:
      different basis, different valuation, different currency.

  - id: pbs_quarterly_national_accounts_sdmx
    name: Quarterly national accounts (PBS, SDMX)
    publisher: pbs
    theme: growth
    page: https://www.pbs.gov.pk/national-accounts
    url: https://www.pbs.gov.pk/wp-content/uploads/2020/07/QNAG.xml
    fmt: xml
    frequency: quarterly
    coverage: 2016-Q1 onward
    parser: parse_sdmx_pbs_qna
    tier: 1
    notes: >
      Independent cross-check on the SBP quarterly national accounts workbook.
      Both start 2015-09-30 and end 2026-03-31, which is what confirmed the
      fiscal-quarter reading of the SDMX period labels.

  - id: pbs_producer_prices_sdmx
    name: Wholesale / producer price index (PBS, SDMX)
    publisher: pbs
    theme: inflation
    page: https://www.pbs.gov.pk/price-statistics
    url: https://www.pbs.gov.pk/wp-content/uploads/2020/07/PPI.xml
    fmt: xml
    frequency: monthly
    coverage: 2021-04 onward
    parser: parse_sdmx_pbs_ppi
    tier: 1
    notes: >
      The only machine-readable WPI source. Base 2015-16. The historical CPI
      workbook also carries a WPI column on the older base; the two bases are
      not splice-compatible.

  - id: pbs_energy_sdmx
    name: Oil and energy indicators (PBS, SDMX)
    publisher: pbs
    theme: energy
    page: https://www.pbs.gov.pk/
    url: https://www.pbs.gov.pk/wp-content/uploads/2020/07/ORSI.xml
    fmt: xml
    frequency: monthly
    coverage: 2022-01 onward
    parser: parse_sdmx_pbs_energy
    tier: 1
    notes: >
      Crude oil and refinery indicators. The only automated energy series in this
      pipeline - NEPRA publishes generation and tariff data in PDF only and OGRA
      blocks all non-interactive requests. Short history and narrow coverage; it
      does not substitute for the NEPRA State of Industry report.

  - id: pbs_labour_sdmx
    name: Labour force indicators (PBS, SDMX)
    publisher: pbs
    theme: labour
    page: https://www.pbs.gov.pk/labour-force-statistics
    url: https://www.pbs.gov.pk/wp-content/uploads/2020/07/LMI.xml
    fmt: xml
    frequency: annual
    coverage: 1991 to 2021
    parser: parse_sdmx_pbs_labour
    tier: 1
    discontinued: true
    notes: >
      Labour force, employment and unemployment, fiscal years. STOPS AT 2021 -
      PBS has not refreshed this feed since the 2020-21 Labour Force Survey, so
      it is flagged discontinued to keep it from raising a staleness warning
      every run. Any later labour data must be read from the LFS report PDFs.
