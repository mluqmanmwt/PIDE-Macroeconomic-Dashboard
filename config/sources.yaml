# =============================================================================
# PIDE Macroeconomic Indicator Dashboard — Source Registry
# =============================================================================
# Every entry is an OFFICIAL Government of Pakistan / State Bank source.
# All `url` values below were HTTP-verified. See docs/DATA_CATALOG.md.
#
# Field reference
#   id            : unique snake_case key; also the raw filename stem
#   name          : human-readable dataset name
#   publisher     : sbp | pbs | mof | fbr | nepra | ogra
#   theme         : inflation | monetary | fiscal | external | growth | labour | energy
#   page          : official landing page (for citation in the dashboard)
#   url           : direct download URL (static) OR null when `discover` is used
#   discover      : dynamic-URL strategy (pbs_media_search | mof_link_scan | fbr_link_scan | nepra_link_scan)
#   query         : search string used by the `discover` strategy
#   fmt           : xlsx | xls | pdf | csv | xml
#   frequency     : daily | weekly | monthly | quarterly | biannual | annual
#   coverage      : historical span actually present in the file
#   parser        : function in etl/parsers/ that tidies this file (null = raw archive only)
#   tier          : 1 = dashboard core (fully automated)
#                   2 = automated download, semi-structured parse
#                   3 = archive/reference only (PDF; manual or LLM extraction)
# =============================================================================

defaults:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  timeout: 120
  retries: 3
  backoff: 5

sources:

  # ---------------------------------------------------------------- INFLATION
  - id: pbs_cpi_historical
    name: CPI / RPI / WPI historical indices and inflation rates (base 2015-16)
    publisher: pbs
    theme: inflation
    page: https://www.pbs.gov.pk/price-statistics/
    url: https://www.pbs.gov.pk/wp-content/uploads/2020/07/indices_and_growth_rates_historical.xlsx
    fmt: xlsx
    frequency: monthly
    coverage: 2016-07 onward (2015-16 base); 2007-08 base series also included
    parser: parse_pbs_cpi_historical
    tier: 1
    notes: >
      Four sheets: Historical Indices, Historical Indices 2015-16,
      Historical Inflation Rate, Historical Inflation Rat2015-16.
      This is the single best inflation series for the dashboard.

  - id: pbs_spi_weekly
    name: Weekly Sensitive Price Indicator (SPI) report
    publisher: pbs
    theme: inflation
    page: https://www.pbs.gov.pk/spi
