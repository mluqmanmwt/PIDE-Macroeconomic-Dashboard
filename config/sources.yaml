    url: https://www.sbp.org.pk/assets/document/neer-reer.xls
    fmt: xls
    frequency: monthly
    coverage: 2013-01 to 2023-12
    discontinued: true
    notes: >-
      Discovered through SBP's own JSON file catalog. Contradicts the widely
      repeated claim that REER exists only inside the EasyData portal. SBP has
      not updated the file since December 2023, so it is a historical series.
    parser: parse_sbp_reer_neer
