    theme: monetary
    page: https://www.sbp.org.pk/ecodata/index2.asp
    url: https://www.sbp.org.pk/assets/document/sir.pdf
    fmt: pdf
    frequency: fortnightly
    coverage: policy rate 2023-01 onward; KIBOR and bank rates rolling ~12 months
    notes: >-
      The only machine-readable official carrier of the SBP policy rate. SBP
      publishes no spreadsheet version. Page 1 gives the corridor by effective
      date, page 2 KIBOR monthly averages, page 6 weighted-average bank rates.
    parser: parse_sbp_interest_rates
    tier: 1

  - id: sbp_interest_rate_corridor
    name: SBP standing facility usage (ceiling / floor amounts and institutions)
    notes: >-
      Despite the file name this is NOT the policy rate. It records how much
      liquidity banks took from the ceiling (reverse repo) and floor (repo)
      standing facilities, in Rs million, plus the number of institutions.
      Use sbp_interest_rates for the policy rate itself.
    publisher: sbp
    theme: monetary
    page: https://www.sbp.org.pk/ecodata/index2.asp
    url: https://www.sbp.org.pk/assets/document/IR-Corridor-Hist.xls
    fmt: xls
    frequency: daily
    coverage: 2009-08-13 onward
    parser: parse_sbp_ir_corridor
    tier: 1

